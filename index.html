<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memoria técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de captura para teléfono en campo + pestaña de concentrado con tabla desplazable */
:root{
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --head:#1D2E73; --red:#E7402B;
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#161A2E; --muted:#5A6078; --line:#D9DCE6; --chip:#ECEEF4;
  --brand:#1D2E73; --brand-ink:#FFFFFF; --signal:#E7402B; --signal-soft:#FDE8E4; --signal-ink:#7A1A0E;
  --ok:#1E7A3D; --ok-soft:#E1F1E6; --warn:#9A5B00; --warn-soft:#FBEBD2; --bad:#B3261E; --bad-soft:#F8E1DF;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1120; --surface:#171B30; --ink:#E7E9F2; --muted:#9AA0B8; --line:#2A3050; --chip:#20253F;
  --brand:#8597EC; --brand-ink:#0E1120; --signal:#FF6A52; --signal-soft:#3A1A16; --signal-ink:#FFC4B8;
  --ok:#62C98A; --ok-soft:#163323; --warn:#EAA84A; --warn-soft:#3A2A10; --bad:#F2877E; --bad-soft:#3D1A17; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B30; --ink:#E7E9F2; --muted:#9AA0B8; --line:#2A3050; --chip:#20253F;
  --brand:#8597EC; --brand-ink:#0E1120; --signal:#FF6A52; --signal-soft:#3A1A16; --signal-ink:#FFC4B8;
  --ok:#62C98A; --ok-soft:#163323; --warn:#EAA84A; --warn-soft:#3A2A10; --bad:#F2877E; --bad-soft:#3D1A17; color-scheme:dark }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:13px;opacity:.85}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.18);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;color:inherit;padding:7px 14px;border-radius:7px;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--red);color:#fff}
.stripe{height:5px;background:linear-gradient(90deg,var(--red) 0 22%,#fff 22% 23%,var(--head) 23%)}
.logo{background:#fff;border-radius:8px;padding:5px 9px;display:flex;align-items:center;flex:none}
.logo img{height:30px;width:auto;display:block}
.savebar{font-family:var(--f-mono);font-size:12px;padding:4px 0;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

main{padding-block:16px 80px;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--signal-soft);color:var(--signal-ink);border:1px solid color-mix(in srgb,var(--signal) 40%,transparent)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}

/* Secciones del formulario */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding:14px 16px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sec>summary h2{margin:0;color:var(--brand);font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.03em;flex:1;text-wrap:balance}
.sec>summary .st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.sec>summary .st.ok{background:var(--ok-soft);color:var(--ok)}
.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:4px}
.sec[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.f>span i{font-style:normal;color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;font-size:16px;min-width:0}
textarea{min-height:68px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.unit{position:relative}.unit input{padding-right:38px}.unit em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--f-mono);font-size:13px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.si[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.no[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
button:focus-visible,.chip:focus-visible,label.addph:focus-within{outline:2px solid var(--signal);outline-offset:2px}

.inst{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px}
.inst-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.inst-h b{font-weight:600}
.inst-h b small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}

.item{border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--bg) 50%,var(--surface))}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-h b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.03em}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.add{border-style:dashed;width:100%;padding:12px;background:transparent}

.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.ph.busy{display:grid;place-items:center;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
label.addph{position:relative;width:84px;height:84px;border:1.5px dashed var(--muted);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1.2;padding:4px}
label.addph svg{display:block;margin:0 auto 3px}
label.addph input{position:absolute;opacity:0;width:1px;height:1px}
.phnote{font-size:12px;color:var(--muted)}
.arca-wrap{position:relative}
.arca-res{display:flex;flex-direction:column;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:4px}
.arca-res button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 12px;cursor:pointer;font-size:15px}
.arca-res button:last-child{border-bottom:0}
.arca-res button:hover,.arca-res button:focus-visible{background:color-mix(in srgb,var(--signal) 14%,transparent)}
.arca-res button span{color:var(--muted);font-size:13px;white-space:nowrap}
.arca-res button.arca-otra{background:color-mix(in srgb,var(--signal) 8%,transparent);border-bottom:2px solid var(--line)}
.arca-res p{margin:0;padding:10px 12px;font-size:14px;color:var(--muted)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary div{background:var(--surface);padding:10px 12px}
.summary small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.summary b{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.check{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.check h3{margin:0;font-family:var(--f-display);text-transform:uppercase;font-size:18px;letter-spacing:.03em}
.check ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.check .req li{color:var(--bad)}.check .adv li{color:var(--warn)}

.start{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.start h1{margin:0;font-family:var(--f-display);font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;text-wrap:balance}
.start p{margin:0;color:var(--muted);max-width:62ch}
.mini{display:flex;flex-direction:column;gap:6px}
.mini button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:10px 12px;cursor:pointer}
.mini button span{color:var(--muted);font-size:13px;font-family:var(--f-mono)}

/* Concentrado */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{flex:1 1 160px;width:auto}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:980px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.mono{font-family:var(--f-mono);font-size:13px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--signal) 8%,transparent)}
tfoot td{font-weight:600;background:var(--bg);border-bottom:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.draft{background:var(--warn-soft);color:var(--warn)}
.yn{font-family:var(--f-mono);font-size:13px}.yn.s{color:var(--ok);font-weight:500}.yn.n{color:var(--muted)}
.rowact{display:flex;gap:4px}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.overlay div{background:var(--surface);border-radius:12px;padding:20px 24px;font-weight:600;max-width:340px;text-align:center}
.overlay small{display:block;font-weight:400;color:var(--muted);margin-top:6px;font-family:var(--f-mono)}
@media (max-width:520px){ .brand b{font-size:19px} .tabs{width:100%} .tabs button{flex:1} .logo img{height:24px} }
/* Concentrado limpio */
.ctable{min-width:860px}
.ctable td small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ctable td.est b{color:var(--brand)}
.stat{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cards{display:none;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.card-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-h b{color:var(--brand);font-size:17px;line-height:1.2}
.card .meta{font-size:13px;color:var(--muted)}
.card .nums{display:flex;flex-wrap:wrap;gap:6px}
.card .nums span{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:13px;font-family:var(--f-mono)}
@media (max-width:720px){ .tablewrap.big{display:none} .cards{display:flex} }
.firma{display:flex;flex-direction:column;gap:6px}
/* Acceso */
.who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.who span{opacity:.9;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who em{font-style:normal;font-size:11px;font-weight:600;background:var(--red);color:#fff;border-radius:99px;padding:2px 8px}
.who button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:7px;padding:5px 10px;font-weight:600;cursor:pointer}
.login{max-width:420px;margin:24px auto 0;width:100%;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:12px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-family:var(--f-display);font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;color:var(--brand)}
.login p{margin:0;color:var(--muted);font-size:14px}
.login input[type=email],.login input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:11px 12px;font-size:16px}
.login .err{color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:9px 12px;font-size:14px}
.login .btn{width:100%;padding:12px}
textarea#descripcion{min-height:220px;line-height:1.55}
.descbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo"><img id="logoimg" alt="Tecnocontrol"></div>
    <div class="brand"><b>Memoria técnica</b><span>Registro de estaciones de autoconsumo</span></div>
    <div class="tabs" id="tabs" role="tablist" hidden>
      <button id="tab-captura" role="tab" aria-selected="true" data-tab="captura">Captura</button>
      <button id="tab-concentrado" role="tab" aria-selected="false" data-tab="concentrado">Concentrado</button>
    </div>
    <div class="who" id="who" hidden></div>
  </div>
  <div class="stripe"></div>
</header>

<div class="wrap"><div class="savebar"><span id="conn"><span class="dot"></span>Conectando…</span><span id="savest"></span></div></div>

<main class="wrap">
  <div id="banner"></div>
  <section id="view-login" hidden></section>
  <section id="view-captura" hidden></section>
  <section id="view-concentrado" hidden></section>
</main>
<div id="toast" class="toast" hidden></div>
<div id="overlay" class="overlay" hidden><div><span id="ovt">Generando PDF…</span><small id="ovs"></small></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config-levantamientos.js"></script>
<script>
(function(){
"use strict";
/* ---------- Conexión a Supabase ---------- */
// La llave (anon public key) se lee del archivo config-levantamientos.js, para no tener que pegarla cada vez que se reemplace este archivo.

function combustiblesCapturados(r){
  const c=new Set((r.general&&r.general.combustibles)||[]);
  const add=p=>{ if(p==='regular'||p==='premium') c.add('gasolina'); else if(['diesel','gaslp','gasnat'].includes(p)) c.add(p); };
  ((r.tanques&&r.tanques.lista)||[]).forEach(x=>add(x.producto));
  ((r.despacho&&r.despacho.dispensarios)||[]).forEach(x=>(x.productos||[]).forEach(add));
  return [...c];
}
function autoRazon(){
  const g=S.rec&&S.rec.general; if(!g||!g.arcaId||g.razonManual) return;
  const rs=arcaRazon(combustiblesCapturados(S.rec)); if(!rs||rs===g.razonSocial) return;
  g.razonSocial=rs;
  const inp=document.getElementById('general.razonSocial'); if(inp&&document.activeElement!==inp) inp.value=rs;
}
function arcaRazon(c){ const r=[]; if(c.includes('gasolina')||c.includes('diesel')) r.push('Distribuidora Arca Comercial'); if(c.includes('gaslp')||c.includes('gasnat')) r.push('Bebidas Mundiales'); return r.join(' / '); }

function getP(o,p){ return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }

function lsSet(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function toast(msg,ms=2800){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,ms); }

function drafts(){ return lsGet('lt.drafts')||{}; }

function dropDraft(folio,ver){ const d=drafts(); if(d[folio]&&(!ver||d[folio].actualizadoEn===ver)){ delete d[folio]; lsSet('lt.drafts',d); } }
function deviceId(){ let id=lsGet('lt.device'); if(!id){ id='dev-'+Date.now().toString(36)+'-'+rid(); lsSet('lt.device',id); } return id; }

/* ---------- Antigüedad de la estación ---------- */
// La antigüedad se cuenta desde la fecha de inicio de operaciones hasta HOY, por eso cada vez que se genera el PDF sale actualizada.
// PENDIENTE (vigencia del permiso): cuando el Excel traiga la fecha de otorgamiento y la vigencia del permiso
// (se cree que son 30 años; confirmarlo con el Excel), mostrar un aviso 2 años antes de que venza.
// Idea: const VIGENCIA_ANIOS=30, AVISO_ANIOS=2; vence = inicio + VIGENCIA_ANIOS; si hoy >= vence - AVISO_ANIOS, avisar en la captura, el PDF y el concentrado.
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function parseFecha(v){ const s=String(v||'').trim(); let m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(m) return {y:+m[1],m:+m[2],d:+m[3]}; m=/^(\d{4})$/.exec(s); if(m) return {y:+m[1],m:0,d:0}; return null; }
function fechaLarga(v){ const f=parseFecha(v); if(!f) return ''; return f.m?f.d+' de '+MESES[f.m-1]+' de '+f.y:String(f.y); }
function antiguedad(v){
  const f=parseFecha(v); if(!f) return null; const h=new Date(); const hy=h.getFullYear(), hm=h.getMonth()+1, hd=h.getDate();
  let a=hy-f.y; if(f.m&&(hm<f.m||(hm===f.m&&hd<f.d))) a--; return a<0?null:a;
}
/* ---------- Redacción en español ---------- */
const NUM=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez'];
function num(n,fem,pron){ n=Number(n)||0; if(n===1) return fem?'una':(pron?'uno':'un'); return n<=10?NUM[n]:fmt(n); }
function cnt(n,sing,plur,fem){ return num(n,fem)+' '+(Number(n)===1?sing:plur); }
function antTxt(a){ return a===0?'menos de un año':cnt(a,'año','años'); }
function lista(a,conj){ a=a.filter(Boolean); conj=conj||'y'; if(a.length<2) return a[0]||''; const last=a[a.length-1]; let c=conj;
  if(conj==='y'&&/^(i|hi)(?!e)/i.test(norm(last))&&!/^hi[aeou]/i.test(norm(last))) c='e'; if(conj==='o'&&/^(o|ho)/i.test(norm(last))) c='u';
  return a.slice(0,-1).join(', ')+' '+c+' '+last; }
const cap1=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const low1=s=>s&&!/^[A-ZÁÉÍÓÚÑ]{2}/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;
const PRODTXT={regular:'gasolina regular',premium:'gasolina premium',diesel:'diésel',gaslp:'gas LP',gasnat:'gas natural',otro:'otro producto'};
const INSTTXT={cuartoElectrico:'cuarto eléctrico',oficina:'oficina',residuos:'cuarto de residuos peligrosos',sanitarios:'sanitarios',cuartoMaquinas:'cuarto de máquinas',plantaEmergencia:'planta de emergencia',bodega:'bodega de lubricantes'};
// [singular, plural, femenino] para lo que se cuenta; [texto] para lo que no se cuenta
const SEGTXT={paroEmergencia:['paro de emergencia','paros de emergencia'],extintores:['extintor','extintores'],tierraFisica:['sistema de tierras físicas'],pararrayos:['pararrayos','pararrayos'],
  pozosMonitoreo:['pozo de monitoreo','pozos de monitoreo'],pozosObservacion:['pozo de observación','pozos de observación'],trampa:['trampa de combustibles','trampas de combustibles',1],
  bocatoma:['bocatoma de llenado','bocatomas de llenado',1],recuperacion:['sistema de recuperación de vapores'],techumbre:['techumbre en la zona de despacho'],
  volumetrico:['sistema de control volumétrico'],senalizacion:['señalización y ruta de evacuación']};
const SEGART={tierraFisica:'un ',recuperacion:'un ',volumetrico:'un '};

/* ---------- Descripción ejecutiva (se escribe sola con lo capturado) ---------- */
function genDesc(r){
  const g=r.general||{}, t=totals(r), P1=[], P2=[];
  // Identificación y ubicación
  const razon=String(g.razonSocial||'').split('/').map(x=>x.trim()).filter(Boolean);
  const ubic=[g.direccion,g.municipio,g.estado].map(x=>String(x||'').trim()).filter(Boolean).join(', ');
  const ant=antiguedad(g.inicioOperacion);
  const pred=[];
  if(ubic) pred.push('se ubica en '+ubic);
  if(ant!=null){ const f=parseFecha(g.inicioOperacion); pred.push('opera desde '+(f.m?'el ':'')+fechaLarga(g.inicioOperacion)+', con una antigüedad de '+antTxt(ant)); }
  const nom=String(g.nombre||'').trim();
  let s1=(!nom?'La estación de autoconsumo':/autoconsumo|^estaci[oó]n/i.test(nom)?'La estación '+nom:'La estación de autoconsumo '+nom)+(razon.length?', a cargo de '+lista(razon)+',':'');
  s1+=' '+(pred.length?lista(pred):'forma parte del presente levantamiento')+'.';
  P1.push(s1);
  if(String(g.permiso||'').trim()) P1.push('Cuenta con el permiso '+String(g.permiso).trim()+'.');
  if(String(g.uso||'').trim()) P1.push('El combustible se destina a '+low1(String(g.uso).trim()).replace(/\.$/,'')+'.');
  const p=r.predio||{};
  if(Number(p.superficie)>0) P1.push('El predio tiene una superficie de '+fmt(p.superficie)+' m²'+(Number(p.frente)>0&&Number(p.fondo)>0?' ('+fmt(p.frente)+' m de frente por '+fmt(p.fondo)+' m de fondo)':'')+'.');
  else if(Number(p.frente)>0&&Number(p.fondo)>0) P1.push('El predio mide '+fmt(p.frente)+' m de frente por '+fmt(p.fondo)+' m de fondo.');
  // Tanques
  const tq=getP(r,'tanques.lista')||[];
  if(tq.length){
    const tipos=[...new Set(tq.map(x=>x.tipo).filter(Boolean))];
    const adj=tipos.length===1&&tq.every(x=>x.tipo)?(tipos[0]==='subterraneo'?'subterráneo':'superficial'):'';
    const grupos={}; tq.forEach(x=>{ const k=x.producto||'sin'; (grupos[k]=grupos[k]||{n:0,c:0}); grupos[k].n++; grupos[k].c+=Number(x.capacidad)||0; });
    const ks=Object.keys(grupos).filter(k=>k!=='sin');
    let s;
    if(tq.length===1){ const x=tq[0];
      s='Dispone de un tanque de almacenamiento'+(adj?' '+adj:'')+(x.producto?' de '+PRODTXT[x.producto]:'')+(Number(x.capacidad)>0?' con capacidad de '+fmt(x.capacidad)+' litros':'');
    }else{
      s='Dispone de '+cnt(tq.length,'tanque','tanques')+' de almacenamiento'+(adj?' '+adj+'s':'')+(ks.length===1&&!grupos.sin?' de '+PRODTXT[ks[0]]:'')+(t.capacidad>0?', con una capacidad total de '+fmt(t.capacidad)+' litros':'');
      if(ks.length>1) s+=': '+lista(ks.map(k=>num(grupos[k].n,0,1)+' de '+PRODTXT[k]+(grupos[k].c>0?' ('+fmt(grupos[k].c)+' L)':'')));
      if(!adj&&tipos.length>1){ const sub=tq.filter(x=>x.tipo==='subterraneo').length, sup=tq.filter(x=>x.tipo==='superficial').length;
        s+='; de ellos, '+lista([sub?num(sub,0,1)+(sub===1?' es subterráneo':' son subterráneos'):'',sup?num(sup,0,1)+(sup===1?' es superficial':' son superficiales'):''].filter(Boolean)); }
    }
    P1.push(s+'.');
  }
  const con=getP(r,'tanques.consola');
  if(con==='si'){ const mm=[getP(r,'tanques.consolaMarca'),getP(r,'tanques.consolaModelo')].map(x=>String(x||'').trim()).filter(Boolean).join(' ');
    const est=String(getP(r,'tanques.consolaEstado')||'').trim();
    P1.push('Cuenta con consola de medición'+(mm?' '+mm:'')+(est?', cuyo estado se reportó como '+low1(est).replace(/\.$/,''):'')+'.'); }
  else if(con==='no') P1.push('No cuenta con consola de medición.');
  // Despacho
  const ds=getP(r,'despacho.dispensarios')||[]; const islas=Number(getP(r,'despacho.islas'))||0;
  if(ds.length){
    const gp=new Set(); ds.forEach(x=>(x.productos||[]).forEach(k=>gp.add(k)));
    const gasTxt=gp.has('gaslp')&&gp.has('gasnat')?'gas LP y gas natural':gp.has('gasnat')?'gas natural':'gas LP';
    const parts=[t.mangGas?num(t.mangGas,1,0)==='una'?'una de gasolina':num(t.mangGas,1)+' de gasolina':'',t.mangDie?num(t.mangDie,1)+' de diésel':'',t.mangOtro?num(t.mangOtro,1)+' de '+gasTxt:''].filter(Boolean);
    let s='La zona de despacho cuenta con '+(islas?cnt(islas,'isla','islas',1)+' y ':'')+cnt(ds.length,'dispensario','dispensarios');
    if(t.mangueras){ s+=parts.length===1?', con '+cnt(t.mangueras,'manguera','mangueras',1)+' '+parts[0].replace(/^\S+\s/,''):', con un total de '+cnt(t.mangueras,'manguera','mangueras',1)+': '+lista(parts); }
    P1.push(s+'.');
    if(t.master||t.satelite){ const d=[t.master?num(t.master,0,1)+(t.master===1?' es Master':' son Master'):'',t.satelite?num(t.satelite,0,1)+(t.satelite===1?' es Satélite':' son Satélite'):''].filter(Boolean);
      P1.push('De los dispensarios de diésel, '+lista(d)+'.'); }
  }
  // Instalaciones
  const si=INST.filter(([k])=>getP(r,'instalaciones.'+k+'.existe')==='si').map(([k])=>INSTTXT[k]);
  const no=INST.filter(([k])=>getP(r,'instalaciones.'+k+'.existe')==='no').map(([k])=>INSTTXT[k]);
  if(si.length) P2.push('Sus instalaciones incluyen '+lista(si)+'.');
  if(no.length) P2.push('No cuenta con '+lista(no,'ni')+'.');
  // Seguridad
  const sgSi=[], sgNo=[];
  SEG.forEach(([k])=>{ const v=getP(r,'seguridad.'+k), tx=SEGTXT[k];
    if(v==='si'){ const n=Number(getP(r,'seguridadDet.'+k+'.cantidad'))||0; sgSi.push(tx.length>1&&n>0?cnt(n,tx[0],tx[1],tx[2]):tx.length>1?tx[1]:(SEGART[k]||'')+tx[0]); }
    else if(v==='no') sgNo.push(tx[tx.length>1?1:0]); });
  if(sgSi.length) P2.push('En materia de seguridad, el sitio cuenta con '+lista(sgSi)+'.');
  if(sgNo.length) P2.push('No se identificaron en sitio: '+lista(sgNo)+'.');
  // Cierre
  if(g.fecha){ const c=String(g.cuadrilla||'').trim(), rp=String(g.responsable||'').trim();
    P2.push('El levantamiento se realizó el '+fechaLarga(g.fecha)+(c?' por la '+(/^cuadrilla/i.test(c)?c:'cuadrilla '+c):'')+(rp?', bajo la responsabilidad de '+rp:'')+'.'); }
  return [P1.join(' '),P2.join(' ')].filter(Boolean).join('\n\n');
}

   Todos los usuarios con cuenta en Supabase pueden entrar, capturar y ver el concentrado.

   Los administradores (tabla levantamientos_admins en Supabase) pueden editar y borrar cualquiera.

function photoUrl(id){
  if(!id) return '';

/* ---------- Totales ---------- */
function totals(r){
  const tq=(r.tanques&&r.tanques.lista)||[], ds=(r.despacho&&r.despacho.dispensarios)||[];
  const t={ tanques:tq.length, capacidad:0, porProd:{}, disp:ds.length, master:0, satelite:0, mangGas:0, mangDie:0, mangOtro:0, fotos:collectPhotos(r).length };
  tq.forEach(x=>{ const c=Number(x.capacidad)||0; t.capacidad+=c; if(x.producto) t.porProd[x.producto]=(t.porProd[x.producto]||0)+c; });
  ds.forEach(x=>{ if(x.tipoDiesel==='master') t.master++; if(x.tipoDiesel==='satelite') t.satelite++; t.mangGas+=Number(x.mangGas)||0; t.mangDie+=Number(x.mangDie)||0; t.mangOtro+=Number(x.mangOtro)||0; });
  t.mangueras=t.mangGas+t.mangDie+t.mangOtro; return t;
}
function collectPhotos(r){
  const out=[]; const add=(arr,cap)=>(arr||[]).forEach(id=>out.push({id,cap}));
  add(r.fotosGenerales,'Vista general / fachada');
  add(r.predio&&r.predio.fotos,'Predio / croquis');
  INST.forEach(([k,l])=>add(getP(r,'instalaciones.'+k+'.fotos'),l));
  add(r.tanques&&r.tanques.consolaFotos,'Consola de medición');
  ((r.tanques&&r.tanques.lista)||[]).forEach((x,i)=>add(x.fotos,'Tanque '+(i+1)+(x.producto?' · '+LBL[x.producto]:'')+(x.capacidad?' · '+fmt(x.capacidad)+' L':'')));
  add(r.despacho&&r.despacho.fotos,'Zona de despacho');
  ((r.despacho&&r.despacho.dispensarios)||[]).forEach((x,i)=>add(x.fotos,'Dispensario '+(x.numero||i+1)+(x.tipoDiesel&&x.tipoDiesel!=='na'?' · Diésel '+LBL[x.tipoDiesel]:'')));
  SEG.forEach(([k,l])=>segItems(r,k).forEach((it,i)=>add(it.fotos,l+' No. '+(i+1)+(it.ubicacion?' · '+it.ubicacion:''))));
  add(r.seguridad&&r.seguridad.fotos,'Seguridad · fotos generales');
  return out;
}

/* ---------- Validación ---------- */
function validate(r){
  const req=[], adv=[]; const g=r.general||{};
  [['nombre','Nombre de la estación'],['municipio','Municipio'],['estado','Estado'],['fecha','Fecha'],['cuadrilla','Cuadrilla'],['responsable','Responsable del levantamiento']].forEach(([k,l])=>{ if(!String(g[k]||'').trim()) req.push(l); });
  if(!String(g.coordenadas||'').trim()) adv.push('Coordenadas GPS');
  if(!parseFecha(g.inicioOperacion)) adv.push('Inicio de operaciones (para calcular la antigüedad)');
  if(!(r.fotosGenerales||[]).length) adv.push('Foto de vista general / fachada');
  INST.forEach(([k,l,main])=>{ const x=getP(r,'instalaciones.'+k)||{}; if(main&&!x.existe) req.push(l+': indicar si cuenta'); if(x.existe==='si'&&!(x.fotos||[]).length) adv.push(l+': falta foto de evidencia'); });
  const tq=(r.tanques&&r.tanques.lista)||[];
  if(!tq.length) req.push('Registrar al menos un tanque');
  tq.forEach((x,i)=>{ if(!x.producto) req.push('Tanque '+(i+1)+': producto'); if(!(Number(x.capacidad)>0)) req.push('Tanque '+(i+1)+': capacidad'); if(!(x.fotos||[]).length) adv.push('Tanque '+(i+1)+': falta foto'); });
  if(!getP(r,'tanques.consola')) req.push('Indicar si hay consola de medición');
  if(getP(r,'tanques.consola')==='si'&&!(getP(r,'tanques.consolaFotos')||[]).length) adv.push('Consola de medición: falta foto');
  const ds=(r.despacho&&r.despacho.dispensarios)||[];
  if(!ds.length) req.push('Registrar al menos un dispensario');
  ds.forEach((x,i)=>{ const n='Dispensario '+(x.numero||i+1); const p=x.productos||[];
    if(!p.length) req.push(n+': productos que despacha');
    if(p.includes('diesel')&&!['master','satelite'].includes(x.tipoDiesel)) req.push(n+': indicar si el diésel es Master o Satélite');
    if((p.includes('regular')||p.includes('premium'))&&!(Number(x.mangGas)>0)) req.push(n+': mangueras de gasolina');
    if(p.includes('diesel')&&!(Number(x.mangDie)>0)) req.push(n+': mangueras de diésel');
    if((p.includes('gaslp')||p.includes('gasnat'))&&!(Number(x.mangOtro)>0)) req.push(n+': mangueras de gas LP / natural');
    if(!(x.fotos||[]).length) adv.push(n+': falta foto'); });
  SEG.forEach(([k,l])=>{ if(getP(r,'seguridad.'+k)!=='si') return;
    if(!(Number(getP(r,'seguridadDet.'+k+'.cantidad'))>0)) adv.push(l+': indicar cuántos hay');
    segItems(r,k).forEach((it,i)=>{ const n=l+' No. '+(i+1); if(!String(it.ubicacion||'').trim()) adv.push(n+': escribir dónde está'); if(!(it.fotos||[]).length) adv.push(n+': falta foto'); }); });
  if(!String(r.llenadoPor||'').trim()) req.push('Nombre de quien llenó el formulario');
  return {req,adv};
}

/* ---------- Constructores de campos ---------- */
function field(label,p,o={}){
  const v=getP(S.rec,p); const type=o.type||'text'; const req=o.req?' <i>*</i>':'';
  const inp=o.area?`<textarea id="${p}" data-p="${p}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`
    :`<input id="${p}" type="${type}" data-p="${p}" value="${esc(v)}" placeholder="${esc(o.ph||'')}"${type==='number'?' inputmode="decimal" min="0"':''}${o.mode?` inputmode="${o.mode}"`:''}>`;
  return `<label class="f${o.full?' full':''}"><span>${label}${req}</span>${o.unit?`<div class="unit">${inp}<em>${o.unit}</em></div>`:inp}${o.help?`<small class="hint">${o.help}</small>`:''}</label>`;
}
function chips(p,opts,cls){ const v=getP(S.rec,p); return `<div class="chips">${opts.map(([k,l])=>`<button type="button" class="chip ${cls?k:''}" data-chip="${p}" data-v="${k}" aria-pressed="${v===k}">${l}</button>`).join('')}</div>`; }
function multi(p,opts){ const v=getP(S.rec,p)||[]; return `<div class="chips">${opts.map(([k,l])=>`<button type="button" class="chip" data-multi="${p}" data-v="${k}" aria-pressed="${v.includes(k)}">${l}</button>`).join('')}</div>`; }
function chipField(label,p,opts,req,cls){ return `<div class="f"><span>${label}${req?' <i>*</i>':''}</span>${chips(p,opts,cls)}</div>`; }
const CAM = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

  return `<div class="photos" data-phw="${p}"${max?` data-max="${max}"`:''}>${thumbs}${sp}${add}</div>`;
}
function arcaPicker(){
  const g=S.rec.general||{}; const sel=ARCA.find(a=>a[0]===g.arcaId);

const norm = x => String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function showArca(q){
  const box=$('#arcaRes'); if(!box) return;

  box.innerHTML=otra+(m.length?m.map(a=>`<button type="button" data-arca="${esc(a[0])}"><b>${esc(a[1])}</b><span>${esc((a[3]||'sin estado')+' · ID '+a[0])}</span></button>`).join('')

function hideArca(){ const box=$('#arcaRes'); if(box) box.hidden=true; }
function applyArca(id){
  hideArca();

  const g=S.rec.general||(S.rec.general={});
  if(id===OTRA_ID){
    if(g.otra) return;
    // Estación fuera del directorio: se vacían los datos que venían de ARCA para capturarlos a mano.
    Object.assign(g,{ otra:true, arcaId:'', region:'', nombre:'', razonSocial:'', razonManual:false, permiso:'', estado:'', municipio:'', direccion:'', combustibles:[], inicioOperacion:'' });
    touched(); renderCaptura(); toast('Llena los datos generales a mano.');
    const n=document.getElementById('general.nombre'); if(n) n.focus({preventScroll:true});

  }
  const a=ARCA.find(x=>x[0]===id); if(!a) return;

  Object.assign(g,{ otra:false, arcaId:a[0], region:a[2], nombre:'ARCA '+a[1], razonSocial:arcaRazon(a[6]), razonManual:false, permiso:a[4], estado:a[3], direccion:a[5], combustibles:a[6].slice(), inicioOperacion:a[7]||g.inicioOperacion||'' });

function resizeSeg(k){
  const base='seguridadDet.'+k;
  const n=Math.max(0,Math.min(50,Math.floor(Number(getP(S.rec,base+'.cantidad'))||0)));

  while(items.length<n) items.push({key:rid(),ubicacion:'',fotos:[]});
  if(items.length>n){ const lost=items.slice(n).some(x=>(x.fotos||[]).length||String(x.ubicacion||'').trim()); items.length=n; if(lost) toast('Se quitaron los espacios que sobraban, con su foto y ubicación.',4000); }

/* ---------- Guardado (Supabase) ---------- */
function touched(){ if(!S.rec||S.readOnly) return; autoRazon(); autoDesc(); S.rec.actualizadoEn=new Date().toISOString(); putDraft(S.rec); clearTimeout(S.timer); S.timer=setTimeout(()=>{ S.timer=null; save(); },1500); renderStatus(); }
async function save(){
  if(!S.sb||!S.rec||S.readOnly){ renderStatus(); return; }
  if(S.saving){ S.again=true; return; }
  S.saving=true; renderStatus();
  if(!S.authed){ renderStatus(); return; }
  if(!S.docs.has(S.rec.folio)&&S.rec.creadoPor!==S.uid) S.rec.creadoPor=S.uid;
  const snap=JSON.parse(JSON.stringify(S.rec)); if(!snap.creadoPor){ snap.creadoPor=S.uid; S.rec.creadoPor=S.uid; }
  snap.actualizadoPor=S.uid;
  try{
    const {error}=await S.sb.from(TABLA).upsert({ folio:snap.folio, data:snap, estatus:snap.estatus, creado_por:snap.creadoPor, actualizado_en:snap.actualizadoEn||new Date().toISOString() });
    if(error) throw error;
    S.docs.set(snap.folio,snap); dropDraft(snap.folio,snap.actualizadoEn); S.lastSaved=new Date(); S.saveErr=null;
  }catch(e){
    const perm=e&&(e.code==='42501'||/row-level security|permission/i.test(e.message||''));
    S.saveErr=perm?'No tienes permiso para modificar este levantamiento':'No se pudo guardar; se reintentará';
    if(!perm) setTimeout(()=>touched(),8000);
  }
  S.saving=false; if(S.again){ S.again=false; save(); } renderStatus();
}
async function syncDrafts(){
  if(!S.sb||!S.authed) return; const d=drafts(); let n=0;
  for(const f of Object.keys(d)){
    const r=d[f]; if(!r||!r.folio) continue;
    if(S.rec&&S.rec.folio===f) continue;
    const cur=S.docs.get(f); if(cur&&String(cur.actualizadoEn||'')>=String(r.actualizadoEn||'')){ dropDraft(f); continue; }
    if(cur&&!canEdit(cur)) continue;
    if(!cur&&r.creadoPor!==S.uid) r.creadoPor=S.uid;
    try{ const {error}=await S.sb.from(TABLA).upsert({ folio:r.folio, data:r, estatus:r.estatus, creado_por:r.creadoPor||S.uid, actualizado_en:r.actualizadoEn||new Date().toISOString() }); if(error) throw error; S.docs.set(f,r); dropDraft(f,r.actualizadoEn); n++; }catch(e){}
  }
  if(n) toast(n===1?'Se subió 1 levantamiento que estaba guardado en este dispositivo.':'Se subieron '+n+' levantamientos que estaban guardados en este dispositivo.',4000);
}
function openRec(folio){
  const d=S.docs.get(folio); if(!d) return;

/* ---------- Fotos (Supabase Storage) ---------- */
async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); await new Promise((ok,ko)=>{ img.onload=ok; img.onerror=ko; img.src=url; });
    const max=1600, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(b=>ok(b),'image/jpeg',0.8));
  } finally { URL.revokeObjectURL(url); }
}
function refreshPhotos(p){ const w=document.querySelector(`[data-phw="${CSS.escape(p)}"]`); if(w) w.outerHTML=photos(p,Number(w.dataset.max)||0); }
async function uploadFiles(p,files){
  if(!S.sb||!S.rec) return;
  const folio=S.rec.folio;
  for(const f of files){
    S.uploads[p]=(S.uploads[p]||0)+1; refreshPhotos(p);
    try{
      let blob=await compress(f).catch(()=>null);
      if(!blob){ if(/^image\/(jpeg|png|webp|gif)$/.test(f.type)) blob=f; else throw {code:'unsupported_type'}; }
      const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':blob.type==='image/gif'?'gif':'jpg';
      const path=folio+'/'+Date.now()+'-'+rid()+'.'+ext;
      const {error}=await S.sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false,cacheControl:'31536000'});
      if(error) throw error;
      if(!S.rec||S.rec.folio!==folio) continue;
      const arr=getP(S.rec,p)||[]; arr.push(path); setP(S.rec,p,arr); touched();
    }catch(e){
      const c=e&&e.code, m=String(e&&(e.message||e.error)||'');
      toast(c==='unsupported_type'?'Formato de imagen no compatible. Usa JPG o PNG.'
        :/too large|exceeded|size/i.test(m)?'La foto es demasiado pesada.'
        :/row-level security|unauthorized|permission|403/i.test(m)?'Sin permiso para subir fotos. Revisa las políticas del bucket.'
        :/bucket not found/i.test(m)?'No existe el espacio de fotos en Supabase.'
        :'No se pudo subir la foto. Revisa tu conexión.',4500);
    }
    S.uploads[p]--; refreshPhotos(p);
  }
  renderCaptura();
}

/* ---------- PDF ---------- */
async function imgData(id){
  const res=await fetch(photoUrl(id)); if(!res.ok) throw new Error('404');
  const b=await res.blob(); const url=URL.createObjectURL(b);
  try{ const img=new Image(); await new Promise((ok,ko)=>{ img.onload=ok; img.onerror=ko; img.src=url; });
    const s=Math.min(1,1100/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return {data:c.toDataURL('image/jpeg',0.8),w:c.width,h:c.height};
  } finally { URL.revokeObjectURL(url); }
}

  catch(e){ overlay(false); toast('No se pudo generar el PDF de fotos.',4000); }
}
async function pdfFor(r){
  if(!needLib()) return; overlay(true,'Generando PDF…','');
  try{ const b=await buildPdf(r); overlay(false); const nm=(getP(r,'general.nombre')||'levantamiento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_').slice(0,40); await deliver(r.folio+'_'+nm+'.pdf',b,'PDF'); }
  catch(e){ overlay(false); toast('No se pudo generar el PDF.',4000); }
}
async function pdfAll(){
  if(!needLib()) return; const rows=rowsFiltered(); overlay(true,'Generando concentrado…','');
  try{
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'letter',orientation:'landscape'});
    pdfHeader(doc,'Memoria técnica · Concentrado',rows.length+' levantamientos'+(F.cuadrilla?' · '+F.cuadrilla:'')+(F.estatus?' · '+(F.estatus==='completo'?'Completos':'Borradores'):'')+' · '+new Date().toLocaleDateString('es-MX'));
    const T={tq:0,cap:0,ds:0,ma:0,sa:0,m:0};
    const body=rows.map(d=>{ const g=d.general||{}, t=totals(d), ins=d.instalaciones||{}; T.tq+=t.tanques;T.cap+=t.capacidad;T.ds+=t.disp;T.ma+=t.master;T.sa+=t.satelite;T.m+=t.mangueras;
      const s=v=>v==='si'?'Sí':v==='no'?'No':'—';
      return [d.folio,g.nombre||'',[g.municipio,g.estado].filter(Boolean).join(', '),g.fecha||'',[g.cuadrilla,g.responsable].filter(Boolean).join(' / '),d.estatus==='completo'?'Completo':'Borrador',s(getP(ins,'cuartoElectrico.existe')),s(getP(ins,'oficina.existe')),s(getP(ins,'residuos.existe')),t.tanques,fmt(t.capacidad),s(getP(d,'tanques.consola')),t.disp,t.master+' / '+t.satelite,t.mangueras]; });
    doc.autoTable({startY:31,margin:{left:14,right:14},theme:'grid',styles:{fontSize:7.6,cellPadding:1.5,lineColor:LINE,lineWidth:.2,textColor:INK},headStyles:{fillColor:BRAND,textColor:255,fontSize:7.4},alternateRowStyles:{fillColor:ZEBRA},
      head:[['Folio','Estación','Ubicación','Fecha','Cuadrilla / responsable','Estatus','C. eléc.','Oficina','Res. pel.','Tanques','Capacidad L','Consola','Disp.','Master / Sat.','Mang.']],body,
      foot:[['','Total','','','','','','','',T.tq,fmt(T.cap),'',T.ds,T.ma+' / '+T.sa,T.m]],footStyles:{fillColor:SOFT,textColor:INK,fontStyle:'bold'},
      columnStyles:{9:{halign:'right'},10:{halign:'right'},12:{halign:'right'},13:{halign:'center'},14:{halign:'right'}}});
    pdfFooter(doc,'Concentrado de levantamientos · generado '+new Date().toLocaleString('es-MX'));
    overlay(false); await deliver('Concentrado_levantamientos_'+today()+'.pdf',doc.output('blob'),'PDF');
  }catch(e){ overlay(false); toast('No se pudo generar el PDF.',4000); }
}
function excelFor(rows,name){
  if(!window.XLSX){ toast('No se pudo cargar el generador de Excel. Recarga la página.',4000); return; }
  if(!rows||!rows.length){ toast('No hay levantamientos para exportar.'); return; }
  const sn=v=>v==='si'?'Sí':v==='no'?'No':'';
  const gen=rows.map(d=>{ const g=d.general||{}, t=totals(d); const o={
    'Folio':d.folio,'Estatus':d.estatus==='completo'?'Completo':'Borrador','ID ARCA':g.arcaId||'','Región':g.region||'','Estación':g.nombre||'','Razón social':g.razonSocial||'','Permiso':g.permiso||'','Inicio de operaciones':g.inicioOperacion||'','Antigüedad (años)':antiguedad(g.inicioOperacion)??'',
    'Domicilio':g.direccion||'','Municipio':g.municipio||'','Estado':g.estado||'','Coordenadas':g.coordenadas||'','Fecha':g.fecha||'','Cuadrilla':g.cuadrilla||'','Responsable':g.responsable||'','Llenó el formulario':d.llenadoPor||'',
    'Contacto':[g.contacto,g.telefono].filter(Boolean).join(' · '),'Uso':g.uso||'' };
    INST.forEach(([k,l])=>o[l]=sn(getP(d,'instalaciones.'+k+'.existe')));
    Object.assign(o,{'Consola':sn(getP(d,'tanques.consola')),'Tanques':t.tanques,'Capacidad total (L)':t.capacidad,'Cap. Regular (L)':t.porProd.regular||0,'Cap. Premium (L)':t.porProd.premium||0,'Cap. Diésel (L)':t.porProd.diesel||0,'Cap. Gas LP (L)':t.porProd.gaslp||0,'Cap. Gas natural (L)':t.porProd.gasnat||0,
      'Dispensarios':t.disp,'Diésel Master':t.master,'Diésel Satélite':t.satelite,'Mangueras gasolina':t.mangGas,'Mangueras diésel':t.mangDie,'Mangueras gas LP / natural':t.mangOtro,'Mangueras total':t.mangueras});
    SEG.forEach(([k,l])=>{ const v=sn(getP(d,'seguridad.'+k)); o[l]=v==='Sí'?'Sí ('+(getP(d,'seguridadDet.'+k+'.cantidad')||segItems(d,k).length)+')':v; });
    o['Fotos']=t.fotos; o['Observaciones']=d.observaciones||''; o['Descripción ejecutiva']=descOf(d); return o; });
  const tq=[], ds=[], sg=[], ft=[];
  rows.forEach(d=>{ const g=d.general||{};
    (getP(d,'tanques.lista')||[]).forEach((x,i)=>tq.push({'Folio':d.folio,'Estación':g.nombre||'','No.':i+1,'Producto':LBL[x.producto]||'','Capacidad (L)':Number(x.capacidad)||0,'Tipo':LBL[x.tipo]||'','Pared':LBL[x.pared]||'','Marca':x.marca||'','Observaciones':x.notas||'','Fotos':(x.fotos||[]).length}));
    (getP(d,'despacho.dispensarios')||[]).forEach((x,i)=>ds.push({'Folio':d.folio,'Estación':g.nombre||'','No.':x.numero||i+1,'Isla':x.isla||'','Marca':x.marca||'','Modelo':x.modelo||'','Productos':(x.productos||[]).map(k=>LBL[k]).join(', '),'Mang. gasolina':Number(x.mangGas)||0,'Mang. diésel':Number(x.mangDie)||0,'Mang. gas LP / natural':Number(x.mangOtro)||0,'Diésel':(x.productos||[]).includes('diesel')?(LBL[x.tipoDiesel]||''):'','Lados':x.lados||'','Fotos':(x.fotos||[]).length}));
    SEG.forEach(([k,l])=>{ const v=sn(getP(d,'seguridad.'+k)); const its=segItems(d,k);
      if(its.length) its.forEach((it,i)=>sg.push({'Folio':d.folio,'Estación':g.nombre||'','Elemento':l,'¿Hay?':v,'Cantidad':Number(getP(d,'seguridadDet.'+k+'.cantidad'))||its.length,'No.':i+1,'Ubicación':it.ubicacion||'','Foto':(it.fotos||[])[0]?photoUrl(it.fotos[0]):''}));
      else sg.push({'Folio':d.folio,'Estación':g.nombre||'','Elemento':l,'¿Hay?':v,'Cantidad':'','No.':'','Ubicación':'','Foto':''}); });
    collectPhotos(d).forEach(p=>ft.push({'Folio':d.folio,'Estación':g.nombre||'','Descripción':p.cap,'Liga de la foto':photoUrl(p.id)}));
  });
  const wb=XLSX.utils.book_new();
  const add=(data,nm)=>{ const ws=XLSX.utils.json_to_sheet(data.length?data:[{'Sin datos':''}]);
    const keys=Object.keys(data[0]||{'Sin datos':''}); ws['!cols']=keys.map(k=>({wch:Math.min(48,Math.max(k.length+2,...data.map(r=>String(r[k]??'').length+1)))}));
    if(data.length) ws['!autofilter']={ref:ws['!ref']};
    XLSX.utils.book_append_sheet(wb,ws,nm); };
  add(gen,'Levantamientos'); add(tq,'Tanques'); add(ds,'Dispensarios'); add(sg,'Seguridad'); add(ft,'Fotos');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  deliver(name,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'Excel');
}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  if(!e.target.closest('.arca-wrap')) hideArca();
  const b=e.target.closest('button,[data-open]'); if(!b) return;
  if(b.dataset.open&&b.tagName!=='BUTTON'&&e.target.closest('button')) return;
  if(b.dataset.arca){ applyArca(b.dataset.arca); return; }
  if(b.dataset.tab){ setTab(b.dataset.tab); return; }
  if(b.dataset.chip&&!S.readOnly){ const p=b.dataset.chip, v=b.dataset.v; setP(S.rec,p,getP(S.rec,p)===v?'':v);
    const m=/^seguridad\.(\w+)$/.exec(p); if(m&&getP(S.rec,p)==='si'&&!(Number(getP(S.rec,'seguridadDet.'+m[1]+'.cantidad'))>0)){ setP(S.rec,'seguridadDet.'+m[1]+'.cantidad',1); resizeSeg(m[1]); }
    touched(); renderCaptura(); return; }
  if(b.dataset.multi&&!S.readOnly){ const p=b.dataset.multi, v=b.dataset.v; const a=(getP(S.rec,p)||[]).slice(); const i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v); setP(S.rec,p,a); touched(); renderCaptura(); return; }
  if(b.dataset.addlist){ const a=getP(S.rec,b.dataset.addlist)||[]; a.push({key:rid(),fotos:[]}); setP(S.rec,b.dataset.addlist,a); touched(); renderCaptura(); return; }
  if(b.dataset.del){ if(!armed(b)) return; const a=getP(S.rec,b.dataset.del)||[]; a.splice(Number(b.dataset.i),1); touched(); renderCaptura(); return; }
  if(b.dataset.delph){ const a=getP(S.rec,b.dataset.delph)||[]; a.splice(Number(b.dataset.i),1); touched(); refreshPhotos(b.dataset.delph); return; }
  if(b.dataset.pdf){ e.stopPropagation(); const d=S.docs.get(b.dataset.pdf); if(d) pdfFor(d); return; }
  if(b.dataset.pdffotos){ e.stopPropagation(); const d=S.docs.get(b.dataset.pdffotos); if(d) pdfFotos(d); return; }
  if(b.dataset.rm){ e.stopPropagation(); if(!armed(b)) return;
    if(!canDelete()){ toast('Solo un administrador puede borrar levantamientos.'); return; }
    const f=b.dataset.rm;
    try{ const {data,error}=await S.sb.from(TABLA).delete().eq('folio',f).select('folio'); if(error) throw error;
      if(!data||!data.length){ toast('No se borró: tu usuario no tiene permiso de administrador en Supabase.',4500); return; }
      S.docs.delete(f); dropDraft(f); if(S.rec&&S.rec.folio===f){ S.rec=null; S.readOnly=false; }
      if(S.tab==='concentrado') renderConcentrado(); else renderCaptura(); renderStatus(); toast('Levantamiento borrado'); }
    catch(err){ toast('No se pudo borrar.'); } return; }
  if(b.dataset.open){ openRec(b.dataset.open); return; }
  if(b.dataset.local){ const r=drafts()[b.dataset.local]; if(r){ S.rec=r; S.readOnly=false; S.showCheck=false; S.lastSaved=null; S.saveErr=null; setTab('captura'); touched(); } return; }
  const a=b.dataset.act;
  if(a==='new'){ if(S.timer){ clearTimeout(S.timer); S.timer=null; await save(); } S.rec=blank(); S.readOnly=false; S.showCheck=false; S.lastSaved=null; S.saveErr=null; setTab('captura'); touched(); }
  else if(a==='close'){ if(S.timer){ clearTimeout(S.timer); S.timer=null; await save(); } S.rec=null; S.readOnly=false; renderCaptura(); renderStatus(); window.scrollTo(0,0); }
  else if(a==='xlsone'){ excelFor([S.rec],S.rec.folio+'_levantamiento.xlsx'); }
  else if(a==='pdf'){ pdfFor(S.rec); }
  else if(a==='pdffotos'){ pdfFotos(S.rec); }
  else if(a==='complete'){ const v=validate(S.rec); S.showCheck=true;
    if(!v.req.length){ S.rec.estatus='completo'; touched(); toast('Marcado como completo. Ya puedes descargar el PDF.'); } else if(S.rec.estatus==='completo'){ S.rec.estatus='borrador'; touched(); }
    renderCaptura(); const c=$('#checkbox'); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(a==='logout'){ logout(); }
  else if(a==='regen'){ S.rec.descManual=false; touched(); renderCaptura(); toast('Se volvió al texto automático.'); }
  else if(a==='pdfall'){ pdfAll(); }
  else if(a==='xlsx'){ excelFor(rowsFiltered(),'Concentrado_levantamientos_'+today()+'.xlsx'); }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.p&&S.rec&&!S.readOnly){ let v=el.value; if(el.type==='number') v=v===''?'':Number(v); setP(S.rec,el.dataset.p,v);
    if(el.dataset.p==='general.razonSocial') S.rec.general.razonManual=String(v).trim()!=='';
    if(el.dataset.p==='llenadoPor') lsSet('lt.nombre',String(v).trim()||null);
    if(el.dataset.p==='descripcion') S.rec.descManual=String(v).trim()!=='';
    touched();
    if(/numero$/.test(el.dataset.p)){ const h=el.closest('.item'); if(h) h.querySelector('.item-h b').textContent='Dispensario '+(el.value||''); } }
  if(el.id==='fq'){ F.q=el.value; renderConcentrado(); }
  if(el.id==='arcaPick') showArca(el.value);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.up){ let files=[...el.files]; el.value=''; const mx=Number(el.dataset.max)||0; if(mx) files=files.slice(0,Math.max(0,mx-(getP(S.rec,el.dataset.up)||[]).length)); uploadFiles(el.dataset.up,files); }
  { const m=el.dataset&&el.dataset.p&&/^seguridadDet\.(\w+)\.cantidad$/.exec(el.dataset.p); if(m&&S.rec&&!S.readOnly){ resizeSeg(m[1]); renderCaptura(); } }
  if(el.id==='fc'){ F.cuadrilla=el.value; renderConcentrado(); }
  if(el.id==='fe'){ F.estatus=el.value; renderConcentrado(); }
  if(el.dataset&&el.dataset.p&&S.rec&&/mang|capacidad/.test(el.dataset.p)) updSummary();
  if(el.dataset&&el.dataset.p==='general.inicioOperacion'&&S.rec) renderCaptura();
});

document.addEventListener('focusin',e=>{
  const el=e.target; if(el.id!=='arcaPick') return;
  const g=(S.rec&&S.rec.general)||{}; const sel=ARCA.find(a=>a[0]===g.arcaId);
  const cur=(sel&&el.value===arcaLabel(sel))||(g.otra&&el.value===OTRA_LABEL);
  showArca(cur?'':el.value);
  if(cur) el.select();
});
document.addEventListener('keydown',e=>{
  const el=e.target; if(el.id!=='arcaPick') return;
  if(e.key==='Escape'){ hideArca(); return; }
  if(e.key==='Enter'){ e.preventDefault(); const f=$('#arcaRes button[data-arca]'); if(f) applyArca(f.dataset.arca); }
});

/* ---------- Arranque ---------- */
function banner(){
  const b=$('#banner');
  if(!S.configured) b.innerHTML='<div class="banner bad">'+(window.supabase?'Falta la llave de Supabase: sube el archivo config-levantamientos.js junto a este.':'No cargó la conexión a Supabase. Revisa tu internet y recarga.')+' Mientras tanto, lo que captures se guarda solo en este dispositivo y no se pueden subir fotos.</div>';
  else if(S.started&&S.dbError){ const m=S.dbErrMsg||''; const noTabla=/does not exist|relation|schema cache|Could not find/i.test(m); const llave=/Invalid API key|JWT|apikey/i.test(m);
    b.innerHTML='<div class="banner bad">'+(noTabla?'Falta crear la tabla <b>levantamientos</b> en Supabase (corre el SQL).':llave?'La llave de Supabase no es válida. Revisa config-levantamientos.js.':'No hay conexión con el concentrado. Revisa tu internet.')+' Lo que captures se guarda en este dispositivo y se sube cuando vuelva la conexión.'+(m?'<br><small>Detalle: '+esc(m)+'</small>':'')+'</div>'; }
  else b.innerHTML='';
}
function refreshViews(){ renderStatus(); banner(); if(!S.authed) return; if(S.tab==='concentrado') renderConcentrado(); else if(!S.rec) renderCaptura(); }
async function loadAll(){
  const {data,error}=await S.sb.from(TABLA).select('folio,data').order('actualizado_en',{ascending:false});
  if(error) throw error;
  S.docs=new Map((data||[]).filter(x=>x&&x.data).map(x=>[x.folio,x.data]));
  S.dbReady=true; S.dbError=false;
}
/* ---------- Acceso (Supabase Auth) ---------- */
const VERSION='21-oct-2026 · login 2';
function renderLogin(msg,lock){
  $('#tabs').hidden=true; $('#who').hidden=true;
  ['captura','concentrado'].forEach(x=>$('#view-'+x).hidden=true);
  const v=$('#view-login'); v.hidden=false;
  const last=lsGet('lt.email')||'';
  v.innerHTML=`<form class="login" id="loginForm" novalidate>
    <h1>Memoria técnica</h1>
    <p>Inicia sesión con tu correo y la contraseña de tu cuenta de Tecnocontrol.</p>
    ${msg?`<div class="err" role="alert">${esc(msg)}</div>`:''}
    <label class="f"><span>Correo</span><input type="email" id="lgEmail" autocomplete="username" inputmode="email" value="${esc(last)}" required></label>
    <label class="f"><span>Contraseña</span><input type="password" id="lgPass" autocomplete="current-password" required></label>
    <button type="submit" class="btn pri" id="lgBtn"${lock?' disabled':''}>Entrar</button>
    <p>¿No tienes cuenta o se te olvidó la contraseña? Pídela a Sistemas.</p>
    <p style="font-size:12px">Versión ${VERSION}</p>
  </form>`;
  setTimeout(()=>{ const i=$(last?'#lgPass':'#lgEmail'); if(i) i.focus(); },0);
}
function renderWho(){
  const w=$('#who'); if(!S.authed){ w.hidden=true; return; }
  w.innerHTML=`<span title="${esc(S.email)}">${esc(S.email)}</span>${S.admin?'<em>Administrador</em>':''}<button type="button" data-act="logout">Salir</button>`;
  w.hidden=false;
}
async function checkAdmin(){
  try{ const {data,error}=await Promise.race([S.sb.rpc('lt_es_admin'),new Promise(r=>setTimeout(()=>r({error:'tiempo'}),8000))]); S.admin=!error&&data===true; }catch(e){ S.admin=false; }
}
async function startSession(session){
  S.authed=true; S.uid=session.user.id; S.email=session.user.email||''; lsSet('lt.email',S.email||null);
  $('#view-login').hidden=true; $('#view-login').innerHTML=''; $('#tabs').hidden=false;
  await checkAdmin(); renderWho();
  setTab(location.hash==='#concentrado'?'concentrado':'captura'); renderStatus(); banner();
  try{ await loadAll(); await syncDrafts(); }catch(e){ S.dbReady=false; S.dbError=true; S.dbErrMsg=(e&&e.message)||''; }
  refreshViews();
  if(S.chan) S.sb.removeChannel(S.chan);
  // Cambios en vivo de otras cuadrillas
  S.chan=S.sb.channel('levantamientos-live')
    .on('postgres_changes',{event:'*',schema:'public',table:TABLA},payload=>{
      if(payload.eventType==='DELETE'){ const f=payload.old&&payload.old.folio; if(f) S.docs.delete(f); }
      else if(payload.new&&payload.new.data){ S.docs.set(payload.new.folio,payload.new.data); }
      refreshViews();
    })
    .subscribe();
}
function endSession(msg){
  if(S.chan){ try{ S.sb.removeChannel(S.chan); }catch(e){} S.chan=null; }
  S.authed=false; S.uid=null; S.email=''; S.admin=false; S.rec=null; S.readOnly=false; S.docs=new Map(); S.dbReady=false;
  renderStatus(); banner(); renderLogin(msg);
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm') return; e.preventDefault();
  if(!S.sb){ return; }
  const email=$('#lgEmail').value.trim(), pass=$('#lgPass').value, btn=$('#lgBtn');
  if(!email||!pass){ renderLogin('Escribe tu correo y tu contraseña.'); return; }
  btn.disabled=true; btn.textContent='Entrando…';
  let res; try{ res=await S.sb.auth.signInWithPassword({email,password:pass}); }catch(err){ res={error:err}; }
  const error=res.error;
  if(!error&&res.data&&res.data.session){ if(!S.authed){ try{ await startSession(res.data.session); }catch(err){ renderLogin('Entraste, pero no se pudo abrir la página: '+(err&&err.message||err)); } } return; }
  if(error){ const m=String(error.message||'');
    renderLogin(/invalid login/i.test(m)?'Correo o contraseña incorrectos.':/not confirmed/i.test(m)?'Tu correo todavía no está confirmado en Supabase. Pide a Sistemas que lo confirme.':/fetch|network/i.test(m)?'No hay conexión a internet. Para entrar la primera vez necesitas señal.':'No se pudo iniciar sesión: '+m);
    lsSet('lt.email',email); }
});
async function logout(){
  if(S.timer){ clearTimeout(S.timer); S.timer=null; await save(); }
  await S.sb.auth.signOut().catch(()=>{});
}

async function init(){
  const img=$('#logoimg'); if(img) img.src=LOGO;
  const old=lsGet('lt.draft'); if(old&&old.folio){ putDraft(old); lsSet('lt.draft',null); }
  S.configured = !!(window.supabase&&window.supabase.createClient) && !/PEGA_AQUI/.test(SUPABASE_ANON_KEY);
  S.started=true;
  if(!S.configured){ renderStatus(); banner(); renderLogin(window.supabase?'Falta la llave de Supabase (archivo config-levantamientos.js). Sin ella no se puede iniciar sesión.':'No cargó la conexión a Supabase. Revisa tu internet y recarga la página.',true); return; }
  // La sesión se queda guardada en el teléfono: en campo sin señal se sigue capturando sin volver a entrar.
  S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'lt-auth'}});
  renderStatus(); banner(); renderLogin();
  let session=null; try{ ({data:{session}}=await S.sb.auth.getSession()); }catch(e){}
  if(session) await startSession(session); else renderLogin();
  // Importante: dentro de este aviso no se puede esperar (await) otra llamada a Supabase porque se traba el login.
  // Por eso todo se manda un instante después con setTimeout.
  S.sb.auth.onAuthStateChange((ev,ses)=>{
    if(ev==='SIGNED_IN'&&ses&&!S.authed) setTimeout(()=>{ if(!S.authed) startSession(ses); },0);
    else if(ev==='SIGNED_OUT') setTimeout(()=>{ if(S.authed||!$('#loginForm')) endSession(); },0);
  });
  // Al regresar a la app, recargar por si se perdió algún cambio
  document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&S.authed){ try{ await loadAll(); await syncDrafts(); refreshViews(); }catch(e){} } });
}
init();
})();
